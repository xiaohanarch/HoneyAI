apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: honeyai-pg
  namespace: honeyai
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2
  storage:
    size: 50Gi
    storageClass: local-path
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      cpu: '1'
      memory: 2Gi
  backup:
    barmanObjectStore:
      destinationPath: s3://$(OSS_BUCKET)/pg-backup
      endpointURL: https://oss-cn-hangzhou.aliyuncs.com
      s3Credentials:
        accessKeyId:
          name: honeyai-secrets
          key: oss_access_key
        secretAccessKey:
          name: honeyai-secrets
          key: oss_secret_key
      wal:
        compression: gzip
        maxParallel: 4
    retentionPolicy: '30d'
