# HTTP-only ingress (no TLS — IP-based deployment, Let's Encrypt not applicable).
# No host rule = Traefik matches all requests on port 80 → web service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: honeyai
  namespace: honeyai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
