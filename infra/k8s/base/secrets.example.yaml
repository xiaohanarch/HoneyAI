# DO NOT commit real values. This file documents the required secrets shape.
# Create the real secret with 02-services.sh or:
#   kubectl create secret generic honeyai-secrets -n honeyai \
#     --from-literal=redis_url=redis://redis:6379 \
#     --from-literal=nextauth_secret=<openssl rand -base64 32> \
#     --from-literal=anthropic_api_key=<sk-ant-...> \
#     --from-literal=github_app_id=<number> \
#     --from-literal=github_app_private_key="$(cat private-key.pem)" \
#     --from-literal=github_app_webhook_secret=<secret> \
#     --from-literal=kek_base64=<openssl rand -base64 32> \
#     --from-literal=oss_access_key=<key> \
#     --from-literal=oss_secret_key=<secret> \
#     --from-literal=oss_bucket=<bucket-name>
apiVersion: v1
kind: Secret
metadata:
  name: honeyai-secrets
  namespace: honeyai
type: Opaque
stringData:
  redis_url: redis://redis:6379
  nextauth_secret: REPLACE_ME
  anthropic_api_key: REPLACE_ME
  github_app_id: REPLACE_ME
  github_app_private_key: REPLACE_ME
  github_app_webhook_secret: REPLACE_ME
  kek_base64: REPLACE_ME
  oss_access_key: REPLACE_ME
  oss_secret_key: REPLACE_ME
  oss_bucket: REPLACE_ME
