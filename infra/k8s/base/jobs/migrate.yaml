# Run drizzle-kit migrate. Uses the worker image (has all monorepo deps).
# Triggered by 02-services.sh on first deploy and by deploy-prod.yml on each release.
apiVersion: batch/v1
kind: Job
metadata:
  name: drizzle-migrate
  namespace: honeyai
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/xiaohanarch/honeyai-worker:latest
          command: ['pnpm', 'db:migrate']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: honeyai-pg-app
                  key: uri
          resources:
            requests:
              cpu: '200m'
              memory: 256Mi
            limits:
              cpu: '500m'
              memory: 512Mi
